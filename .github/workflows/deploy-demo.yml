name: Deploy Demo

# push 到 main 且改动了运行时代码时自动部署评委演示实例。
# Cloud Run 使用 min-instances=0（非常驻）：空闲自动缩到 0，只有被访问时才计费，不持续扣钱。
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'collector/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-demo.yml'
      - 'demo-scan/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCP_PROJECT_ID: gen-lang-client-0580915119
      GCP_REGION: asia-east1
      GAR_REPOSITORY: lablineage
      CLOUD_RUN_SERVICE: lablineage-demo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - id: auth
        name: Authenticate with a service account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: 540.0.0
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build and push immutable image
        shell: bash
        run: |
          set -euo pipefail
          registry="${GCP_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${registry}" --quiet
          docker build --pull --tag "${image}" .
          docker push "${image}"
          echo "DEPLOY_IMAGE=${image}" >> "${GITHUB_ENV}"

      - name: Deploy to Cloud Run (scale-to-zero) and verify readiness
        shell: bash
        env:
          LABLINEAGE_PATH_SALT: ${{ secrets.LABLINEAGE_PATH_SALT }}
          LABLINEAGE_MCP_INTERNAL_TOKEN: ${{ secrets.LABLINEAGE_MCP_INTERNAL_TOKEN }}
        run: |
          set -euo pipefail
          previous_image="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region "${GCP_REGION}" --project "${GCP_PROJECT_ID}" \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || echo '')"
          rollback() {
            if [[ -n "${previous_image}" ]]; then
              echo "::warning::Readiness failed; restoring ${previous_image}"
              gcloud run services update "${CLOUD_RUN_SERVICE}" \
                --image "${previous_image}" \
                --region "${GCP_REGION}" --project "${GCP_PROJECT_ID}" --quiet || true
            fi
          }
          trap rollback ERR
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${DEPLOY_IMAGE}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --platform managed \
            --min-instances 0 \
            --max-instances 1 \
            --cpu 1 --memory 512Mi \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=development,LABLINEAGE_HOST=0.0.0.0,LABLINEAGE_AUTH_MODE=development,LABLINEAGE_DATA_DIR=/tmp/lablineage,LABLINEAGE_SCAN_ROOT=/app/demo-scan,LABLINEAGE_TRUST_PROXY=true,LABLINEAGE_VERTEX_EXPRESS=true,LABLINEAGE_PATH_SALT=${LABLINEAGE_PATH_SALT},LABLINEAGE_MCP_INTERNAL_TOKEN=${LABLINEAGE_MCP_INTERNAL_TOKEN}" \
            --set-secrets "GOOGLE_GENAI_API_KEY=gemini-key:latest" \
            --quiet
          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region "${GCP_REGION}" --project "${GCP_PROJECT_ID}" \
            --format='value(status.url)')"
          ready=false
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "${service_url}/api/health" >/dev/null; then
              revision="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
                --region "${GCP_REGION}" --project "${GCP_PROJECT_ID}" \
                --format='value(status.latestReadyRevisionName)')"
              echo "Deployed ${revision} to ${service_url}"
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "${ready}" != "true" ]]; then
            echo "::error::Cloud Run readiness did not succeed within 120 seconds"
            exit 1
          fi
          trap - ERR
