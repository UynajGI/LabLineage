name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success' && vars.ENABLE_STAGING_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      MIGRATION_JOB: ${{ vars.MIGRATION_JOB }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Validate protected environment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY CLOUD_RUN_SERVICE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured in this GitHub environment"
              exit 1
            fi
          done
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - id: auth
        name: Authenticate with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Install pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: 540.0.0
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Build and push immutable image
        shell: bash
        run: |
          set -euo pipefail
          registry="${GCP_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/lablineage-guardian:${DEPLOY_SHA}"
          gcloud auth configure-docker "${registry}" --quiet
          docker build --pull --tag "${image}" .
          docker push "${image}"
          echo "DEPLOY_IMAGE=${image}" >> "${GITHUB_ENV}"
      - name: Execute forward-only database migration job
        if: env.MIGRATION_JOB != ''
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs update "${MIGRATION_JOB}" \
            --image "${DEPLOY_IMAGE}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --quiet
          gcloud run jobs execute "${MIGRATION_JOB}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --wait
      - name: Deploy, verify readiness, and roll back on failure
        shell: bash
        run: |
          set -euo pipefail
          previous_image="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --format='value(spec.template.spec.containers[0].image)')"
          rollback() {
            echo "::warning::Readiness failed; restoring ${previous_image}"
            gcloud run services update "${CLOUD_RUN_SERVICE}" \
              --image "${previous_image}" \
              --region "${GCP_REGION}" \
              --project "${GCP_PROJECT_ID}" \
              --quiet
          }
          trap rollback ERR
          gcloud run services update "${CLOUD_RUN_SERVICE}" \
            --image "${DEPLOY_IMAGE}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --quiet
          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --format='value(status.url)')"
          identity_token="$(gcloud auth print-identity-token --audiences="${service_url}")"
          for attempt in {1..20}; do
            if curl --fail --silent --show-error \
              --header "Authorization: Bearer ${identity_token}" \
              "${service_url}/api/ready"; then
              trap - ERR
              exit 0
            fi
            sleep 5
          done
          echo "::error::Cloud Run readiness did not succeed within 100 seconds"
          exit 1
