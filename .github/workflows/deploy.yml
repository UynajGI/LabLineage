name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success' && vars.ENABLE_STAGING_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      MIGRATION_JOB: ${{ vars.MIGRATION_JOB }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Validate protected environment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY CLOUD_RUN_SERVICE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured in this GitHub environment"
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - id: auth
        name: Authenticate with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Install pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: 540.0.0
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Build and push immutable image
        shell: bash
        run: |
          set -euo pipefail
          registry="${GCP_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/lablineage-guardian:${DEPLOY_SHA}"
          gcloud auth configure-docker "${registry}" --quiet
          docker build --pull --tag "${image}" .
          docker push "${image}"
          digest="$(gcloud artifacts docker images describe "${image}" --format='value(image_summary.digest)')"
          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Artifact Registry did not return an immutable digest for ${image}"
            exit 1
          fi
          echo "DEPLOY_IMAGE=${image%:*}@${digest}" >> "${GITHUB_ENV}"
      - name: Execute forward-only database migration job
        if: env.MIGRATION_JOB != ''
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs update "${MIGRATION_JOB}" \
            --image "${DEPLOY_IMAGE}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --quiet
          gcloud run jobs execute "${MIGRATION_JOB}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --wait
      - name: Deploy, verify readiness, and roll back on failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          echo "DEPLOY_EVIDENCE_STATUS=started" >> "${GITHUB_ENV}"
          previous_image="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --format='value(spec.template.spec.containers[0].image)')"
          rollback() {
            echo "::warning::Readiness failed; restoring ${previous_image}"
            echo "DEPLOY_EVIDENCE_STATUS=rolled_back" >> "${GITHUB_ENV}"
            echo "DEPLOY_PREVIOUS_IMAGE=${previous_image}" >> "${GITHUB_ENV}"
            gcloud run services update "${CLOUD_RUN_SERVICE}" \
              --image "${previous_image}" \
              --region "${GCP_REGION}" \
              --project "${GCP_PROJECT_ID}" \
              --quiet
          }
          trap rollback ERR
          gcloud run services update "${CLOUD_RUN_SERVICE}" \
            --image "${DEPLOY_IMAGE}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --quiet
          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --format='value(status.url)')"
          identity_token="$(gcloud auth print-identity-token --audiences="${service_url}")"
          ready=false
          for attempt in {1..20}; do
            if curl --fail --silent --show-error \
              --header "Authorization: Bearer ${identity_token}" \
              "${service_url}/api/ready"; then
              revision="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
                --region "${GCP_REGION}" \
                --project "${GCP_PROJECT_ID}" \
                --format='value(status.latestReadyRevisionName)')"
              echo "DEPLOY_EVIDENCE_STATUS=passed" >> "${GITHUB_ENV}"
              echo "DEPLOY_REVISION=${revision}" >> "${GITHUB_ENV}"
              echo "DEPLOY_SERVICE_URL=${service_url}" >> "${GITHUB_ENV}"
              echo "DEPLOY_PREVIOUS_IMAGE=${previous_image}" >> "${GITHUB_ENV}"
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "${ready}" != "true" ]]; then
            echo "::error::Cloud Run readiness did not succeed within 100 seconds"
            exit 1
          fi
          trap - ERR

      - name: Run automatic analysis canary and roll back on failure
        shell: bash
        env:
          LABLINEAGE_CANARY_BEARER_TOKEN: ${{ secrets.STAGING_CANARY_BEARER_TOKEN }}
          LABLINEAGE_CANARY_GITHUB_REPOSITORY: ${{ vars.STAGING_CANARY_GITHUB_REPOSITORY }}
          LABLINEAGE_CANARY_REQUIRE_GITHUB: 'true'
        run: |
          set -euo pipefail
          rollback() {
            echo "::warning::Analysis canary failed; restoring the previous image"
            echo "DEPLOY_EVIDENCE_STATUS=rolled_back_canary" >> "${GITHUB_ENV}"
            gcloud run services update "${CLOUD_RUN_SERVICE}" \
              --image "${DEPLOY_PREVIOUS_IMAGE}" \
              --region "${GCP_REGION}" \
              --project "${GCP_PROJECT_ID}" \
              --quiet
          }
          trap rollback ERR
          if [[ -z "${LABLINEAGE_CANARY_BEARER_TOKEN}" ]]; then
            echo "::error::STAGING_CANARY_BEARER_TOKEN is required in the protected environment"
            exit 1
          fi
          export LABLINEAGE_CANARY_URL="${DEPLOY_SERVICE_URL}"
          node scripts/staging-analysis-canary.mjs artifacts/analysis-canary.json
          echo "DEPLOY_EVIDENCE_STATUS=passed" >> "${GITHUB_ENV}"
          echo "DEPLOY_CANARY_STATUS=passed" >> "${GITHUB_ENV}"
          trap - ERR

      - name: Record Cloud Run deployment evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          node -e "const fs=require('fs'),crypto=require('crypto'); const hash=v=>v?crypto.createHash('sha256').update(v).digest('hex'):null; const canaryBytes=fs.existsSync('artifacts/analysis-canary.json')?fs.readFileSync('artifacts/analysis-canary.json'):null; const canary=canaryBytes?JSON.parse(canaryBytes.toString('utf8')):null; const evidence={schemaVersion:'lablineage.deployment-evidence.v1',generatedAt:new Date().toISOString(),status:process.env.DEPLOY_EVIDENCE_STATUS||'failed_before_readiness',commitSha:process.env.DEPLOY_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),environment:process.env.DEPLOY_ENVIRONMENT,image:process.env.DEPLOY_IMAGE||null,previousImage:process.env.DEPLOY_PREVIOUS_IMAGE||null,revision:process.env.DEPLOY_REVISION||null,serviceUrlSha256:hash(process.env.DEPLOY_SERVICE_URL),readinessEndpoint:'/api/ready',identity:'github-oidc',rollbackConfigured:true,analysisCanarySha256:hash(canaryBytes),analysisCanary:canary}; fs.writeFileSync('artifacts/cloud-run-deployment.json',JSON.stringify(evidence,null,2)+'\n')"
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}

      - name: Upload immutable Cloud Run deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-run-deployment-${{ env.DEPLOY_SHA }}-${{ github.run_attempt }}
          path: |
            artifacts/cloud-run-deployment.json
            artifacts/analysis-canary.json
          if-no-files-found: error
          retention-days: 90
