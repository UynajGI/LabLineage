name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lablineage_test
          POSTGRES_USER: lablineage
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lablineage -d lablineage_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:all
      - run: npm run benchmark:ci --workspace collector
      - run: npm run eval:agent --workspace backend
      - run: npm run validate:deployment --workspace backend
      - run: npm run validate:openapi --workspace backend
      - run: npm run validate:migrations --workspace backend
      - run: npm run validate:idempotency --workspace backend
      - run: npm run validate:workflows
      - run: npm run build
      - run: npm run seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run migrate
        env:
          DATABASE_URL: postgresql://lablineage:test-only-password@127.0.0.1:5432/lablineage_test
      - name: Verify PostgreSQL projection and tenant RLS
        run: npm run test:postgres --workspace backend
        env:
          LABLINEAGE_TEST_DATABASE_ADMIN_URL: postgresql://lablineage:test-only-password@127.0.0.1:5432/lablineage_test
          LABLINEAGE_TEST_DATABASE_APP_URL: postgresql://lablineage_app_test:app-test-only-password@127.0.0.1:5432/lablineage_test
      - run: npm audit --omit=dev --audit-level=critical --registry=https://registry.npmjs.org
      - name: Build production image
        run: docker build --tag lablineage-guardian:${{ github.sha }} .
      - name: Scan production image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lablineage-guardian:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          version: v0.70.0

  supply-chain:
    name: Signed release evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, collector-cross-platform, terraform-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build production image
        run: docker build --tag lablineage-guardian:${{ github.sha }} .
      - name: Prepare release evidence directory
        run: mkdir -p artifacts
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lablineage-guardian:${{ github.sha }}
          format: cyclonedx
          output: artifacts/lablineage-guardian.cdx.json
          version: v0.70.0
      - name: Package Collector and create checksums
        run: |
          npm pack --workspace collector --pack-destination artifacts
          cd artifacts
          sha256sum *.json *.tgz > SHA256SUMS
      - name: Verify release evidence
        run: npm run verify:release
      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Keyless-sign release checksums
        run: cosign sign-blob --yes --bundle artifacts/SHA256SUMS.sigstore.json artifacts/SHA256SUMS
      - name: Verify release signature
        run: >-
          cosign verify-blob
          --bundle artifacts/SHA256SUMS.sigstore.json
          --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          artifacts/SHA256SUMS
      - name: Upload signed release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lablineage-release-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  collector-cross-platform:
    name: Collector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test --workspace collector

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Terraform
        run: |
          curl -fsSLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip
          echo "d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d  /tmp/terraform.zip" | sha256sum --check
          unzip -q /tmp/terraform.zip -d /tmp/terraform
      - run: /tmp/terraform/terraform -chdir=frontend/deploy/terraform fmt -check -recursive
      - run: /tmp/terraform/terraform -chdir=frontend/deploy/terraform init -backend=false -input=false
      - run: /tmp/terraform/terraform -chdir=frontend/deploy/terraform validate
